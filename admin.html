<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Dashboard | Chris Murray</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preload" href="/fonts/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Hanken Grotesk";src:url("/fonts/hanken-grotesk-latin.woff2") format("woff2");font-weight:300 700;font-display:swap}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--forest:#0F3A2E;--forest2:#0B2B22;--cream:#FBF4EC;--ink:#14231E;--moss:#3B5249;--line:rgba(15,58,46,.14);--rust:#A8361A;--honey:#F6AE45;--mint:#A9D3C3;
--amber:linear-gradient(115deg,#8E2410 0%,#B23A17 25%,#D2561E 50%,#EA8128 75%,#F6AE45 100%)}
body{background:var(--cream);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;font-weight:450;font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--forest);outline-offset:3px;border-radius:6px}

/* NAV */
nav{background:var(--forest2);color:#fff;padding:0 clamp(1.25rem,4vw,2.5rem);height:4.5rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.logo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.logo b{font-size:22px;font-weight:700;letter-spacing:-.025em;line-height:1}
.logo i{width:1.5px;height:26px;background:currentColor;opacity:.6}
.logo span{font-size:10px;font-weight:600;letter-spacing:.14em;line-height:1.35;text-transform:uppercase}
.nav-tag{font-size:.8125rem;font-weight:600;color:var(--mint);margin-left:1rem;padding-left:1rem;border-left:1px solid rgba(255,255,255,.2)}
.nav-left{display:flex;align-items:center}
.nav-right{display:flex;align-items:center;gap:1rem}
#adminEmail{font-size:.8125rem;color:var(--mint)}
#signOutBtn{font:inherit;font-size:.8125rem;font-weight:700;background:none;border:2px solid rgba(255,255,255,.45);color:#fff;padding:.45rem 1rem;border-radius:999px;cursor:pointer}
#signOutBtn:hover{border-color:#fff}
@media(max-width:640px){.nav-tag,#adminEmail{display:none}.logo b{font-size:18px}}

/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 4.5rem);padding:2rem 1.25rem;background:radial-gradient(ellipse 45% 90% at 85% 60%,rgba(255,206,110,.5),rgba(255,160,60,0) 70%),var(--amber)}
.login-box{width:100%;max-width:400px;background:var(--forest2);color:#fff;border-radius:24px;padding:2rem}
.login-label{font-size:.875rem;font-weight:600;color:var(--mint);margin-bottom:.4rem}
.login-title{font-size:2rem;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-bottom:1.5rem}
.login-title em{font-style:normal}
.field{display:flex;flex-direction:column;gap:.4rem;margin-bottom:1rem}
.field label{font-size:.8125rem;font-weight:700}
.field input{background:#fff;border:2px solid transparent;color:var(--ink);padding:.8rem 1rem;border-radius:999px;font:inherit;font-size:1rem;outline:none}
.field input:focus{border-color:var(--honey)}
.field input::placeholder{color:#5C6F68}
.login-btn{width:100%;padding:.95rem;background:#fff;color:var(--forest2);font:inherit;font-weight:700;font-size:1rem;border:none;border-radius:999px;cursor:pointer;margin-top:.5rem}
.login-btn:hover{background:var(--honey)}
.login-err{font-size:.875rem;font-weight:600;color:#FFD9A8;margin-top:.5rem;min-height:1.3em}

/* DASHBOARD */
.dashboard{display:none;padding:clamp(2rem,4vw,3rem) clamp(1.25rem,4vw,2.5rem);max-width:1180px;margin:0 auto}
.dash-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:1.75rem;flex-wrap:wrap;gap:1rem}
.dash-title{font-size:clamp(2rem,4vw,2.8rem);font-weight:700;letter-spacing:-.03em;line-height:1.05;color:var(--forest)}
.dash-title em{font-style:normal}
.dash-count{font-size:.9375rem;font-weight:600;color:var(--moss)}

/* CLIENT CARDS */
.clients-list{display:flex;flex-direction:column;gap:.75rem}
.client-card{background:#fff;border-radius:18px;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.client-summary{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 2rem;gap:1rem;align-items:center;padding:1.1rem 1.5rem;cursor:pointer}
.client-summary:hover{background:#FFFBF6}
.client-name{font-size:1.2rem;font-weight:700;letter-spacing:-.02em}
.client-meta{font-size:.875rem;color:var(--moss);margin-top:.15rem}
.score-pill,.rst-dominant-pill{text-align:center}
.score-pill-label{font-size:.75rem;font-weight:700;color:var(--moss);margin-bottom:.15rem}
.score-pill-val{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.score-pill-band{font-size:.75rem;font-weight:700;padding:.15rem .6rem;border-radius:999px;display:inline-block;margin-top:.3rem}
.band-minimal,.band-high{background:#E3F0EA;color:#1E5B44}
.band-mild,.band-medium{background:#FDF0DC;color:#8A5A12}
.band-moderate{background:#FBE6D6;color:#A8361A}
.band-severe,.band-low{background:#F7DCD6;color:#8E2410}
.rst-dominant-pill .rst-val{font-size:.9375rem;font-weight:700}
.expand-icon{color:var(--moss);font-size:.85rem;text-align:right;transition:transform .2s}
.client-card.open .expand-icon{transform:rotate(180deg)}

/* EXPANDED DETAIL */
.client-detail{display:none;border-top:1px solid var(--line);padding:1.75rem 1.5rem 2rem}
.client-card.open .client-detail{display:block}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.25rem 2rem;margin-bottom:1rem}
.detail-block{display:flex;flex-direction:column;gap:.2rem}
.detail-label{font-size:.8125rem;font-weight:700;color:var(--rust)}
.detail-value{font-size:1rem;color:var(--ink);line-height:1.55;overflow-wrap:anywhere}
.detail-value.long{color:var(--moss);max-width:72ch;white-space:pre-wrap}
.detail-section{font-size:1.25rem;font-weight:700;letter-spacing:-.02em;color:var(--forest);margin:1.75rem 0 .75rem;padding-bottom:.5rem;border-bottom:2px solid var(--forest)}
.yn-list{display:flex;flex-direction:column}
.yn-item{display:flex;justify-content:space-between;gap:1rem;font-size:.9375rem;color:var(--moss);padding:.55rem 0;border-bottom:1px solid var(--line)}
.yn-item span:last-child{font-weight:700;color:var(--ink)}
.yn-item span.yes{color:#1E5B44}
.yn-item span.no{color:var(--rust)}

/* SCORES DETAIL */
.scores-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.25rem}
.score-card{background:var(--cream);border-radius:18px;padding:1.2rem 1.3rem}
.score-card-label{font-size:.8125rem;font-weight:700;color:var(--rust)}
.score-card-name{font-size:.875rem;color:var(--moss);margin-bottom:.5rem}
.score-card-num{font-size:2.2rem;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.score-card-max{font-size:.875rem;font-weight:600;color:var(--moss);letter-spacing:0}

/* RST BARS */
.rst-detail{background:var(--forest2);color:#fff;border-radius:18px;padding:1.3rem 1.5rem;margin-top:1rem}
.rst-detail-title{font-size:.9375rem;font-weight:700;color:var(--honey);margin-bottom:1rem}
.rst-bar-row{display:flex;align-items:center;gap:1rem;margin-bottom:.6rem}
.rst-bar-label{font-size:.875rem;color:#E4ECE8;width:140px;flex-shrink:0}
.rst-bar-label.dom{color:var(--honey);font-weight:700}
.rst-track{flex:1;background:rgba(255,255,255,.12);height:6px;border-radius:3px;overflow:hidden}
.rst-fill{height:100%;background:#7FA897;border-radius:3px}
.rst-fill.dom{background:var(--honey)}
.rst-score{font-size:.875rem;color:#E4ECE8;width:24px;text-align:right;font-variant-numeric:tabular-nums}
.rst-note{font-size:.875rem;color:var(--honey);margin-top:.8rem}
.more-label{margin-bottom:.25rem}

/* PRINT */
@media print{nav{display:none}body{background:#fff}.client-card{break-inside:avoid;box-shadow:none;border:1px solid #ccc}.client-detail{display:block!important}.expand-icon{display:none}}

.loader{text-align:center;padding:4rem 1rem;color:var(--moss);font-size:1rem}

@media(max-width:760px){
 .client-summary{grid-template-columns:1fr 1fr 1fr 2rem}
 .client-summary>div:first-child{grid-column:1/-1}
 .rst-dominant-pill{display:none}
 .scores-row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<nav>
  <div class="nav-left">
    <a href="/" class="logo" aria-label="Chris Murray Precision Hypnosis, home"><b>Chris Murray</b><i></i><span>Precision<br>Hypnosis</span></a>
    <span class="nav-tag">Client dashboard</span>
  </div>
  <div class="nav-right">
    <span id="adminEmail"></span>
    <button id="signOutBtn" style="display:none;" onclick="doSignOut()">Sign out</button>
  </div>
</nav>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <p class="login-label">Admin access</p>
    <h1 class="login-title">Client dashboard</h1>
    <div class="field"><label for="adminLoginEmail">Email</label><input type="email" id="adminLoginEmail" placeholder="your@email.com" autocomplete="email"></div>
    <div class="field"><label for="adminLoginPass">Password</label><input type="password" id="adminLoginPass" placeholder="Password" autocomplete="current-password"></div>
    <div class="login-err" id="loginErr"></div>
    <button class="login-btn" onclick="adminSignIn()">Sign in</button>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <div class="dash-header">
    <div>
      <h2 class="dash-title">Client submissions</h2>
    </div>
    <span class="dash-count" id="clientCount"></span>
  </div>
  <div id="clientsList"><div class="loader">Loading clients...</div></div>
</div>

<script type="module">
import { initializeApp }    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collectionGroup, getDocs, query } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey:            "AIzaSyDQer6mLk5McOdpfHRawSUfl1OtY9f9I3M",
  authDomain:        "cmh-database.firebaseapp.com",
  projectId:         "cmh-database",
  storageBucket:     "cmh-database.firebasestorage.app",
  messagingSenderId: "130418997333",
  appId:             "1:130418997333:web:cb6a5c72d5153fef49fcdc"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const ADMIN_EMAIL = 'chris@sansungroup.com';

onAuthStateChanged(auth, async user => {
  if (user && user.email === ADMIN_EMAIL) {
    document.getElementById('loginWrap').style.display  = 'none';
    document.getElementById('dashboard').style.display  = 'block';
    document.getElementById('adminEmail').textContent   = user.email;
    document.getElementById('signOutBtn').style.display = 'inline';
    await loadClients();
  } else if (user) {
    signOut(auth);
    document.getElementById('loginErr').textContent = 'Access restricted to admin account.';
  } else {
    document.getElementById('loginWrap').style.display  = 'flex';
    document.getElementById('dashboard').style.display  = 'none';
    document.getElementById('signOutBtn').style.display = 'none';
  }
});

window.adminSignIn = async function() {
  const email = document.getElementById('adminLoginEmail').value.trim();
  const pass  = document.getElementById('adminLoginPass').value;
  const err   = document.getElementById('loginErr');
  err.textContent = '';
  try { await signInWithEmailAndPassword(auth, email, pass); }
  catch(e) { err.textContent = 'Incorrect email or password.'; }
};

window.doSignOut = () => signOut(auth);

async function loadClients() {
  const list = document.getElementById('clientsList');
  try {
    const snap = await getDocs(query(collectionGroup(db, 'intake')));
    const docs = [];
    snap.forEach(d => { if (d.id === 'form' && d.data().firstName) docs.push(d.data()); });
    docs.sort((a,b) => (b.submittedAt?.seconds||0) - (a.submittedAt?.seconds||0));
    document.getElementById('clientCount').textContent = docs.length + ' client' + (docs.length !== 1 ? 's' : '');
    if (!docs.length) { list.innerHTML = '<div class="loader">No submissions yet.</div>'; return; }
    list.innerHTML = docs.map((d,i) => renderCard(d, i)).join('');
    list.querySelectorAll('.client-summary').forEach(el => {
      el.addEventListener('click', () => el.closest('.client-card').classList.toggle('open'));
    });
  } catch(e) {
    list.innerHTML = '<div class="loader">Error loading data. Check Firestore rules allow admin read access.</div>';
    console.error(e);
  }
}

function bandClass(type, score) {
  if (type === 'gad7')  return score<=4?'minimal':score<=9?'mild':score<=14?'moderate':'severe';
  if (type === 'phq9')  return score<=4?'minimal':score<=9?'mild':score<=14?'moderate':'severe';
  if (type === 'wemwbs')return score<=14?'low':score<=21?'medium':'high';
  return '';
}
function bandLabel(type, score) {
  const c = bandClass(type, score);
  return c.charAt(0).toUpperCase() + c.slice(1);
}
function yn(val) {
  if (!val) return '<span>—</span>';
  return val === 'yes' ? '<span class="yes">Yes</span>' : '<span class="no">No</span>';
}
function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function safe(v) { return v ? esc(v) : '<span style="color:#5C6F68">Not provided</span>'; }
function date(d) { return d?.seconds ? new Date(d.seconds*1000).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '—'; }

function renderCard(d, i) {
  const s = d.scores || {};
  const rst = s.rst || {};
  const domMap = { V:'Visual', A:'Auditory', K:'Kinaesthetic', Ad:'Auditory Digital' };
  const dominant = rst.dominant ? esc(domMap[rst.dominant] || rst.dominant) : '—';
  const gad7  = s.gad7  != null ? esc(s.gad7)  : '—';
  const phq9  = s.phq9  != null ? esc(s.phq9)  : '—';
  const wemwbs= s.wemwbs != null ? esc(s.wemwbs) : '—';

  return `
  <div class="client-card" id="card${i}">
    <div class="client-summary">
      <div>
        <div class="client-name">${esc(d.firstName)} ${esc(d.lastName)}</div>
        <div class="client-meta">${date(d.submittedAt)} &nbsp;·&nbsp; ${esc(d.nationality)}</div>
      </div>
      <div class="score-pill">
        <div class="score-pill-label">GAD-7</div>
        <div class="score-pill-val">${gad7}</div>
        ${gad7!=='—'?`<div class="score-pill-band band-${bandClass('gad7',gad7)}">${bandLabel('gad7',gad7)}</div>`:''}
      </div>
      <div class="score-pill">
        <div class="score-pill-label">PHQ-9</div>
        <div class="score-pill-val">${phq9}</div>
        ${phq9!=='—'?`<div class="score-pill-band band-${bandClass('phq9',phq9)}">${bandLabel('phq9',phq9)}</div>`:''}
      </div>
      <div class="score-pill">
        <div class="score-pill-label">Wellbeing</div>
        <div class="score-pill-val">${wemwbs}</div>
        ${wemwbs!=='—'?`<div class="score-pill-band band-${bandClass('wemwbs',wemwbs)}">${bandLabel('wemwbs',wemwbs)}</div>`:''}
      </div>
      <div class="rst-dominant-pill">
        <div class="score-pill-label">Rep System</div>
        <div class="rst-val">${dominant}</div>
      </div>
      <div class="expand-icon">&#9660;</div>
    </div>

    <div class="client-detail">
      <div class="detail-grid">
        <div class="detail-block"><div class="detail-label">Full Name</div><div class="detail-value">${esc(d.firstName)} ${esc(d.lastName)}</div></div>
        <div class="detail-block"><div class="detail-label">Date of Birth</div><div class="detail-value">${safe(d.dob)}</div></div>
        <div class="detail-block"><div class="detail-label">Location</div><div class="detail-value">${safe(d.nationality)}</div></div>
        <div class="detail-block"><div class="detail-label">Phone / WhatsApp</div><div class="detail-value">${safe(d.phone)}</div></div>
        <div class="detail-block"><div class="detail-label">Email</div><div class="detail-value">${safe(d.email)}</div></div>
        <div class="detail-block"><div class="detail-label">Next of Kin</div><div class="detail-value">${safe(d.nextOfKin)}</div></div>
        <div class="detail-block"><div class="detail-label">GP / Doctor</div><div class="detail-value">${safe(d.gp)}</div></div>
        <div class="detail-block"><div class="detail-label">Submitted</div><div class="detail-value">${date(d.submittedAt)}</div></div>
      </div>

      <div class="detail-section">Clinical</div>
      <div class="yn-list">
        <div class="yn-item"><span>Permission to contact GP</span>${yn(d.permGP)}</div>
        <div class="yn-item"><span>Currently under medical/psychiatric care</span>${yn(d.underCare)}</div>
        <div class="yn-item"><span>Agrees to attend sessions substance-free</span>${yn(d.substanceFree)}</div>
        <div class="yn-item"><span>Epilepsy diagnosis</span>${yn(d.epilepsy)}</div>
        <div class="yn-item"><span>Psychiatric diagnosis</span>${yn(d.psychiatricDx)}</div>
      </div>
      ${d.mentalHistory ? `<div style="margin-top:0.8rem;"><div class="detail-label more-label">Mental health history</div><div class="detail-value long">${esc(d.mentalHistory)}</div></div>` : ''}
      ${d.medications   ? `<div style="margin-top:0.8rem;"><div class="detail-label more-label">Medications</div><div class="detail-value long">${esc(d.medications)}</div></div>` : ''}

      <div class="detail-section">Presenting Issue</div>
      <div style="display:flex;flex-direction:column;gap:1rem;">
        ${d.presentingIssue ? `<div><div class="detail-label more-label">What brings them here</div><div class="detail-value long">${esc(d.presentingIssue)}</div></div>` : ''}
        ${d.duration       ? `<div><div class="detail-label more-label">Duration</div><div class="detail-value">${esc(d.duration)}</div></div>` : ''}
        ${d.prevAttempts   ? `<div><div class="detail-label more-label">Previous attempts</div><div class="detail-value long">${esc(d.prevAttempts)}</div></div>` : ''}
        ${d.successVision  ? `<div><div class="detail-label more-label">What success looks like</div><div class="detail-value long">${esc(d.successVision)}</div></div>` : ''}
      </div>

      <div class="detail-section">Outcome Scores</div>
      <div class="scores-row">
        <div class="score-card">
          <div class="score-card-label">GAD-7</div>
          <div class="score-card-name">Anxiety</div>
          <div class="score-card-num">${gad7} <span class="score-card-max">/ 21</span></div>
          ${gad7!=='—'?`<div class="score-pill-band band-${bandClass('gad7',gad7)}" style="margin-top:0.5rem;">${bandLabel('gad7',gad7)}</div>`:''}
        </div>
        <div class="score-card">
          <div class="score-card-label">PHQ-9</div>
          <div class="score-card-name">Mood</div>
          <div class="score-card-num">${phq9} <span class="score-card-max">/ 27</span></div>
          ${phq9!=='—'?`<div class="score-pill-band band-${bandClass('phq9',phq9)}" style="margin-top:0.5rem;">${bandLabel('phq9',phq9)}</div>`:''}
        </div>
        <div class="score-card">
          <div class="score-card-label">WEMWBS</div>
          <div class="score-card-name">Wellbeing</div>
          <div class="score-card-num">${wemwbs} <span class="score-card-max">/ 35</span></div>
          ${wemwbs!=='—'?`<div class="score-pill-band band-${bandClass('wemwbs',wemwbs)}" style="margin-top:0.5rem;">${bandLabel('wemwbs',wemwbs)}</div>`:''}
        </div>
      </div>

      ${rst.V !== undefined ? `
      <div class="rst-detail">
        <div class="rst-detail-title">Representational System Profile</div>
        ${[['V','Visual',rst.V],['A','Auditory',rst.A],['K','Kinaesthetic',rst.K],['Ad','Auditory Digital',rst.Ad]].map(([k,label,score])=>`
          <div class="rst-bar-row">
            <div class="rst-bar-label ${k===rst.dominant?'dom':''}">${label} ${k===rst.dominant?'★':''}</div>
            <div class="rst-track"><div class="rst-fill ${k===rst.dominant?'dom':''}" style="width:${Math.max(0,Math.min(100,Math.round((Number(score)||0)/20*100)))}%"></div></div>
            <div class="rst-score">${esc(score)}</div>
          </div>`).join('')}
        <div class="rst-note">Dominant: ${dominant}, score ${esc(rst[rst.dominant])}/20</div>
      </div>` : ''}
    </div>
  </div>`;
}
</script>
</body>
</html>
